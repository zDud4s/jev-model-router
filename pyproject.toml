[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-model-router"
version = "0.1.0"
description = "OpenAI-compatible HTTP proxy that routes each request to a configured backend tier and logs what it cost."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
jev-model-router = "jev_model_router.cli:main"

[tool.setuptools.packages.find]
include = ["jev_model_router*"]

[tool.setuptools.package-data]
# What `jev-model-router init` builds a config from.
jev_model_router = ["data/*.yaml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
