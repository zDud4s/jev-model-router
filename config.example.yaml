# llm-router configuration.
#
# This file IS the model catalog. Nothing in the source names a model, so adding
# a backend is one entry here and no code change.

server:
  host: 127.0.0.1
  port: 8080

log:
  path: ./llm-router.db
  # Prompts are user data, so only their SHA-256 is stored by default.
  # Set to true to keep the full text as well.
  store_prompts: false

router:
  kind: static          # static | classifier
  default_tier: cheap
  # Optional: let a client that hardcodes a vendor model string pick a tier.
  model_map:
    gpt-4o: top
    gpt-4o-mini: cheap

  # --- kind: classifier -----------------------------------------------------
  # A learned router. It reads the prompt and predicts whether `default_tier`'s
  # answer would survive review; above `threshold` the request goes straight to
  # `strong_tier` and no cheap answer is produced at all.
  #
  # The model is not bundled and cannot be. Its labels come from the
  # verification loop below, so the order is: verification on at sample_rate
  # 1.0, real traffic, then `llm-router train`. With `kind: classifier` and no
  # readable model file the proxy refuses to start, rather than quietly serving
  # every request from default_tier and looking identical to a working router
  # in every report it produces.
  #
  # strong_tier: top
  # model_path: ./classifier.json
  # threshold: 0.5        # omit to use the threshold the model was trained with
  #
  # Fraction of would-be escalations sent to default_tier anyway, so they get
  # answered and reviewed. Without it the model destroys the evidence that
  # would test it: every prompt it scores high skips the cheap tier, is never
  # verified, and never becomes a label, so the NEXT model is fitted only on
  # prompts this one already believed were easy. Those explored rows are the
  # only ones that can ever contradict it.
  #
  # Note that this knob and verification.sample_rate MULTIPLY: explore_rate 0.10
  # with sample_rate 0.25 labels 2.5% of would-be escalations, not 10%.
  #
  # explore_rate: 0.05

tiers:
  # A local model. No prices, so it costs zero -- that is the correct answer,
  # not a missing value, and it needs no configuration to say so.
  cheap:
    backend: ollama
    model: llama3.1:8b
    base_url: http://localhost:11434
    context_window: 131072
    supports_tools: false

  # `backend: openai_compatible` covers OpenAI, OpenRouter, vLLM, and Anthropic
  # behind an OpenAI-shaped proxy. The api key is read from the named env var at
  # call time, so this file carries no credential.
  mid:
    backend: openai_compatible
    model: claude-sonnet-5
    base_url: https://api.example-proxy.com/v1
    api_key_env: LLM_ROUTER_MID_KEY
    context_window: 200000
    supports_tools: true
    # USD per 1M tokens; every field optional. An omitted cache_read is billed
    # at the input rate, not at zero: providers report cached tokens whether or
    # not you priced them (OpenRouter marked a whole repeated prompt cached),
    # and a discount you did not write down is not one the report may claim.
    prices:
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 3.75

  top:
    backend: openai_compatible
    model: claude-opus-5
    base_url: https://api.example-proxy.com/v1
    api_key_env: LLM_ROUTER_TOP_KEY
    context_window: 200000
    supports_tools: true
    prices:
      input: 15.00
      output: 75.00
      cache_read: 1.50
      cache_write: 18.75

# The verification loop: a stronger tier reads the cheap tier's answer and says
# whether it stands. A failed verdict re-runs the request at `escalate_to`, and
# the client receives that second answer instead.
#
# OFF by default, and the default is not shyness. Every checked request buys a
# second call, and every failed verdict buys a third; with the tiers above, a
# request that is routed cheap and then fails review costs MORE than sending it
# to `top` in the first place. `llm-router stats` prints the loop's spend as a
# share of the bill for exactly this reason -- read it before believing a
# savings number.
verification:
  enabled: false
  verifier_tier: top        # who judges
  verify_tiers: [cheap]     # which served tiers get judged; empty = all but the verifier
  escalate_to: top          # who re-answers a failed verdict; defaults to verifier_tier

  # Fraction of eligible answers actually reviewed. Keep it at 1.0 while the
  # loop is producing labelled data; drop it once the failure rate is known and
  # you are paying for confirmation rather than discovery.
  sample_rate: 1.0

  # What happens when the verifier cannot be understood, or cannot be reached.
  # `accept` keeps the cheap answer; `escalate` buys a second one. The default
  # refuses to spend money because a verifier is misconfigured -- `stats` counts
  # both cases so the choice stays visible rather than convenient.
  on_unparseable: accept    # accept | escalate
  on_verifier_error: accept # accept | escalate

  # An answer that is empty, or cut off at this tier's own output budget, is
  # failed without a review: the response body already says so, and reading it
  # costs nothing, so sample_rate does not apply to those. With this on, the
  # SAME tier is asked once more before a stronger one is paid for.
  #
  # Measured on 400 GSM8K questions through qwen3.5:4b: of 60 answers that ran
  # past the budget without finishing, 33 were answered on the next ask -- and
  # 27 of those finished inside the same budget, several in under 300 tokens.
  # The budget was never binding on them; the first sample ran away.
  #
  # Off by default because whether it pays is arithmetic, not taste: a retry is
  # worth it when the cheap tier costs less than (retry success rate) x the
  # strong tier. At 45%, a local tier at a fiftieth of the price is free money
  # and a cheap tier at half the price is a loss. A retry that fails is billed
  # and then escalates, so the row shows both calls.
  retry_unfinished: false

  # Bounds on what the verifier is shown. A review prompt that grows without
  # limit is how a verification loop quietly becomes the most expensive call in
  # the system.
  max_transcript_chars: 12000
  max_answer_chars: 8000

  # A ceiling, not a spend: a judge that answers directly stops by itself at
  # 6-26 tokens. It binds only on a THINKING judge, which reasons before it
  # writes the verdict; cut off, it gives none, and on_unparseable: accept
  # turns that into a pass nobody made. Measured: deepseek-v4-flash via
  # OpenRouter finished every verdict in 54-183 at 1024, and lost one at 200;
  # a local qwen3.5:4b needed 490-1054. Turning reasoning off instead
  # (Ollama: extra_body {think: false}; OpenRouter: {reasoning: {enabled:
  # false}}) is ~6 tokens a verdict and both judges then passed a wrong answer
  # they caught with reasoning on.
  max_verdict_tokens: 1024

  # Optional. Replaces the built-in reviewer instructions wholesale. Whatever
  # you write must still ask for a line of the form `VERDICT: PASS` or
  # `VERDICT: FAIL`, or every verdict is unparseable.
  # system_prompt: |
  #   ...
