# jev-model-router example config.
#
# The easy path is `jev-model-router init`, which detects this machine and writes a
# config for you. This file is the hand-written alternative: copy it to config.yaml,
# edit the tiers, then run `jev-model-router -c config.yaml check`.
#
# This file IS the model catalog: nothing in the source names a model.
# Why each option exists, with measurements: DESIGN.md.

server:
  host: 127.0.0.1
  port: 8080

log:
  path: ./jev-model-router.db
  store_prompts: false      # only a SHA-256 of each prompt is kept unless true

router:
  kind: static              # static | classifier | capabilities
  default_tier: cheap
  model_map:                # optional: a client asking for this model gets this tier
    gpt-4o: top
    gpt-4o-mini: cheap

  # kind: classifier -- learned from verification verdicts (`jev-model-router train`).
  # strong_tier: top
  # model_path: ./classifier.json
  # explore_rate: 0.05      # keep a few predicted-hard requests cheap, so they get judged

  # kind: capabilities -- Jev scores what the request needs; the cheapest tier
  # likely to succeed serves it. Tiers can be discovered instead of listed:
  # capabilities:
  #   jev_tier: judge
  #   target: 0.8
  #   on_jev_failure: fallback  # fallback | reject: when Jev does not answer, serve the
  #                             # default tier, or refuse with 503 jev_unavailable
  #   discover:
  #     or:
  #       backend: openai_compatible
  #       base_url: https://openrouter.ai/api/v1
  #       api_key_env: OPENROUTER_API_KEY
  #       effort_body: {reasoning: {effort: "{effort}"}}
  #       require_evidence: true    # only models with benchmark data or a profile
  #   # How a whole routed task divides its input, per output token. Measured
  #   # 2026-09-26 over 1461 local agent tasks; `jev-model-router measure-shape`
  #   # prints this machine's. It orders tiers on /v1/route; it budgets nothing.
  #   task_shape:
  #     input_per_output: 295
  #     cache_read: 0.971
  #     cache_write: 0.026
  #   # A requirement Jev reads inside `band` (it cannot tell) admits only tiers
  #   # whose card is at `min_level` on it. `unsure: {}` takes these defaults.
  #   unsure:
  #     band: [0.30, 0.70]
  #     min_level: 2

tiers:
  # Local model. No prices means it costs zero.
  cheap:
    backend: ollama
    model: llama3.1:8b
    base_url: http://localhost:11434
    context_window: 131072
    supports_tools: false

  # Any OpenAI-compatible API: OpenAI, OpenRouter, vLLM, a proxy.
  # The key is read from the named env var (or `jev-model-router keys set`).
  mid:
    backend: openai_compatible
    model: claude-sonnet-5
    base_url: https://api.example-proxy.com/v1
    api_key_env: JEV_MODEL_ROUTER_MID_KEY
    context_window: 200000
    supports_tools: true
    prices:                 # USD per 1M tokens; an omitted cache_read bills at input
      input: 3.00
      output: 15.00
      cache_read: 0.30
      cache_write: 3.75

  top:
    backend: openai_compatible
    model: claude-opus-5
    base_url: https://api.example-proxy.com/v1
    api_key_env: JEV_MODEL_ROUTER_TOP_KEY
    context_window: 200000
    supports_tools: true
    prices:
      input: 15.00
      output: 75.00
      cache_read: 1.50
      cache_write: 18.75

  # A judge, not a model: Jev answers yes/no with a probability and cannot
  # generate text, so it can verify answers but never serve one.
  judge:
    backend: jev
    model: jev-latest
    endpoints:              # same model from two providers; the first with a key wins
      - label: TypeSafe
        base_url: https://api.typesafe.ai/v1
        api_key_env: TYPESAFE_API_KEY
      - label: OpenRouter
        base_url: https://openrouter.ai/api/v1
        model: "~typesafe/jev-latest"
        api_key_env: OPENROUTER_API_KEY
        key_url: https://openrouter.ai/keys
    context_window: 32000
    supports_tools: false
    prices:
      input: 0.042
      output: 0.0
    jev:
      threshold: 0.5        # probability at or above which the answer passes

# Verification: a stronger tier reviews the cheap answer; a FAIL re-runs the request
# on `escalate_to` and the client gets that answer instead. Off by default because
# every review is another call -- `stats` shows what the loop costs.
verification:
  enabled: false
  verifier_tier: top        # who judges (try `judge` for a far cheaper review)
  verify_tiers: [cheap]     # whose answers get judged
  escalate_to: top          # who re-answers a failed one
  sample_rate: 1.0          # share of answers reviewed
  on_unparseable: accept    # accept | escalate
  on_verifier_error: accept # accept | escalate
  retry_unfinished: false   # re-ask the same tier once before escalating a cut-off answer
  max_verdict_tokens: 1024  # raise it for a thinking judge on open-ended prompts
